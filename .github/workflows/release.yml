name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (must match manifest.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run tests (gate release)
        run: |
          node --check index.js
          node --test

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches release version
        run: |
          MANIFEST_VERSION=$(node -e 'console.log(require("./manifest.json").version)')
          if [ "$MANIFEST_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match release version (${{ steps.ver.outputs.version }})."
            exit 1
          fi

      - name: Build artifacts (lyrics-search.zip + update.json)
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh

      - name: Verify zip has manifest.json at root
        run: |
          if unzip -l lyrics-search.zip | grep -qE '(^| )manifest\.json$'; then
            echo "manifest.json at zip root: OK"
          else
            echo "::error::lyrics-search.zip does not contain manifest.json at its root."
            unzip -l lyrics-search.zip
            exit 1
          fi

      - name: Create tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag exists, skipping."
          else
            git tag "${{ steps.ver.outputs.tag }}"
            git push origin "${{ steps.ver.outputs.tag }}"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" lyrics-search.zip update.json \
            --repo "${{ github.repository }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file CHANGELOG.md
